<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">A2A agent security map</title>
  <desc id="desc">A diagram showing trust boundaries between local agents, A2A peers, skills, artifacts, and runtime defenses.</desc>
  <rect width="1120" height="430" fill="#fffdf8"/>
  <rect x="34" y="38" width="1052" height="354" fill="#f7f4ef" stroke="#ddd7cb" stroke-width="2"/>
  <line x1="558" y1="72" x2="558" y2="358" stroke="#b44728" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="558" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#b44728">Trust Boundary</text>

  <g font-family="system-ui, sans-serif">
    <rect x="82" y="116" width="214" height="112" rx="8" fill="#eaf4f2" stroke="#176f6b" stroke-width="2"/>
    <text x="189" y="155" text-anchor="middle" font-size="24" font-weight="800" fill="#22211f">Local Agent</text>
    <text x="189" y="184" text-anchor="middle" font-size="15" fill="#66645f">execution principal</text>

    <rect x="82" y="264" width="214" height="78" rx="8" fill="#fbe8dc" stroke="#b44728" stroke-width="2"/>
    <text x="189" y="298" text-anchor="middle" font-size="20" font-weight="800" fill="#22211f">Skills / MCP</text>
    <text x="189" y="323" text-anchor="middle" font-size="14" fill="#66645f">supply-chain surface</text>

    <rect x="408" y="116" width="214" height="112" rx="8" fill="#fdf0c8" stroke="#8b6b1f" stroke-width="2"/>
    <text x="515" y="155" text-anchor="middle" font-size="23" font-weight="800" fill="#22211f">A2A Peer</text>
    <text x="515" y="184" text-anchor="middle" font-size="15" fill="#66645f">identity + capability</text>

    <rect x="408" y="264" width="214" height="78" rx="8" fill="#efe8f7" stroke="#6c4d8a" stroke-width="2"/>
    <text x="515" y="298" text-anchor="middle" font-size="20" font-weight="800" fill="#22211f">Artifacts</text>
    <text x="515" y="323" text-anchor="middle" font-size="14" fill="#66645f">payloads crossing agents</text>

    <rect x="736" y="116" width="258" height="112" rx="8" fill="#eaf4f2" stroke="#176f6b" stroke-width="2"/>
    <text x="865" y="154" text-anchor="middle" font-size="23" font-weight="800" fill="#22211f">Protocol Defenses</text>
    <text x="865" y="184" text-anchor="middle" font-size="15" fill="#66645f">signed cards, scoped tokens</text>

    <rect x="736" y="264" width="258" height="78" rx="8" fill="#fdf0c8" stroke="#8b6b1f" stroke-width="2"/>
    <text x="865" y="298" text-anchor="middle" font-size="20" font-weight="800" fill="#22211f">Runtime Guards</text>
    <text x="865" y="323" text-anchor="middle" font-size="14" fill="#66645f">sandbox, audit, approvals</text>
  </g>

  <g fill="none" stroke="#22211f" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M296 172 C340 172 362 172 408 172"/>
    <path d="M515 228 C515 242 515 250 515 264"/>
    <path d="M296 303 C344 303 360 303 408 303"/>
    <path d="M622 172 C670 172 688 172 736 172"/>
    <path d="M622 303 C674 303 684 303 736 303"/>
    <path d="M189 228 C189 244 189 250 189 264"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22211f"/>
    </marker>
  </defs>
</svg>
